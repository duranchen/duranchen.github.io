# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: 角落
subtitle: 记录一下生活和思考
description: 记录一下生活和思考
author: 陈群
language: zh-CN
timezone:

# URL
## If your site is put in a subdirectory, set url as 'http://yoursite.com/child' and root as '/child/'
url: https://blog.duranc.cc
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link: true # Open external links in new tab
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace:

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: next

# Deployment
## Docs: https://hexo.io/zh-cn/docs/github-pages
## 部署已改为 GitHub Actions（.github/workflows/pages.yml）：push 到 main 即自动构建并发布。
## 本文件不再配置 deploy 段，hexo-deployer-git 已从依赖移除 —— `hexo deploy` 会报错，这是有意的
## （该路径曾在 2026-09-17 造成源码误推事故）。如需临时恢复，见 README「部署（GitHub Actions）」。

## Theme-level settings (disqus_shortname, google_analytics, avatar, scheme, since...)
## live in themes/next/_config.yml and are read from there — keys set in this
## file are NOT picked up by the theme, so do not duplicate them here.
